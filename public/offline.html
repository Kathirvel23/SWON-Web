<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0F766E">
    <meta name="robots" content="noindex">
    <title>Offline · SWON</title>
    <style>
        :root {
            --ink: #10201e;
            --muted: #4f5f5c;
            --canvas: #f6f3ec;
            --card: #ffffff;
            --line: #e4ddd0;
            --primary: #0f766e;
            --primary-dark: #115e59;
            --primary-deep: #0b4540;
            --radius: 18px;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
            background:
                radial-gradient(120% 90% at 84% 4%, rgba(194, 118, 43, 0.10) 0%, rgba(194, 118, 43, 0) 46%),
                var(--canvas);
            color: var(--ink);
            font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 18px 40px -16px rgba(16, 59, 43, 0.28);
            padding: 36px 30px;
            text-align: center;
        }
        .logo {
            width: 84px;
            height: 84px;
            border-radius: 22px;
            display: block;
            margin: 0 auto 18px;
        }
        .brand {
            display: block;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 1.6rem;
            line-height: 1.15;
            letter-spacing: -0.03em;
        }
        p {
            margin: 0 auto 22px;
            max-width: 34ch;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }
        .actions { display: grid; gap: 10px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 20px;
            border-radius: 14px;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            border: 1.5px solid transparent;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 8px 18px -8px rgba(23, 77, 56, 0.42);
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
        .btn-ghost:hover { border-color: var(--primary); color: var(--primary-deep); }
        .note { margin: 18px 0 0; font-size: 0.78rem; color: var(--muted); }
        .note.online { color: var(--primary-dark); font-weight: 700; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>

        <span class="brand">SWON</span>
        <h1>You're offline</h1>
        <p>SWON needs a network connection for this page. Check your connection and try again — nothing you typed has been submitted.</p>
        <div class="actions">
            <button class="btn btn-primary" type="button" id="retry">Try again</button>
            <a class="btn btn-ghost" id="home" href="./">Go to home</a>
        </div>
        <p class="note" id="note" role="status" aria-live="polite">Your saved app files are still available offline.</p>
    </main>
    <script>
        (function () {
            'use strict';
            var note = document.getElementById('note');
            var home = document.getElementById('home');
            var retry = document.getElementById('retry');
            var reloading = false;

            // The offline page can be served for any deep link, so resolve the
            // real app root from the service-worker scope, not a relative path.
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistration) {
                navigator.serviceWorker.getRegistration().then(function (registration) {
                    if (registration && registration.scope) {
                        // Go to the app home, not the intro, after an offline recovery.
                        home.href = registration.scope.replace(/\/?$/, '/') + 'home';
                    }
                }).catch(function () { /* keep the relative fallback */ });
            }

            retry.addEventListener('click', function () {
                window.location.reload();
            });

            // Recover once when the connection returns. The guard prevents a
            // reload loop if the network is flapping or the server is down.
            window.addEventListener('online', function () {
                if (reloading) { return; }
                reloading = true;
                if (note) {
                    note.textContent = 'Back online — reloading…';
                    note.className = 'note online';
                }
                window.setTimeout(function () { window.location.reload(); }, 700);
            });
        })();
    </script>
